title: 'Special project'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          - { handle: title, field: { type: text, display: Title, required: true, localizable: true } }
          - { handle: special_category, field: { type: entries, display: Category, collections: [special_categories], max_items: 1, mode: select, visibility: read_only, localizable: false } }
          - { handle: abstract, field: { type: textarea, display: Abstract, localizable: true } }
          - { handle: overview_image, field: { type: assets, display: 'Overview image or video', container: main, max_files: 1 } }
          - { handle: artists, field: { type: entries, display: Artists, collections: [artists], mode: select, localizable: false } }
          - { import: 'reps::main_content' }
  seo:
    display: SEO
    sections:
      - { fields: [ { import: 'reps::seo' } ] }
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          - { handle: slug, field: { type: slug, required: true, localizable: true, validate: 'max:200' } }
          - { handle: legacy_id, field: { type: integer, display: 'Old Nova id', read_only: true, visibility: read_only, localizable: false } }
