title: 'Special category'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          - { handle: title, field: { type: text, display: Title, required: true, localizable: true } }
          - { handle: headline, field: { type: text, display: Headline, localizable: true } }
          - { handle: intro, field: { type: bard, display: Intro, buttons: [bold, italic, anchor], save_html: false, localizable: true } }
          - { handle: show_in_navigation, field: { type: toggle, display: 'Show in navigation' } }
          - { handle: projects, field: { type: entries, display: Projects, collections: [special_projects], create: true, localizable: false } }
  seo:
    display: SEO
    sections:
      - { fields: [ { import: 'reps::seo' } ] }
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          - { handle: slug, field: { type: slug, required: true, localizable: true, validate: 'max:200' } }
          - { handle: legacy_id, field: { type: integer, display: 'Old Nova id', read_only: true, visibility: read_only, localizable: false } }
